# Caminho: ci/excecoes.yml
#
# ÚNICO lugar onde um achado de severidade alta pode ser aceito.
# Lido por ci/gate_severidade.py. Toda exceção precisa de:
#   ferramenta    semgrep | trivy | gitleaks
#   id            Semgrep: check_id | Trivy: CVE/GHSA | Gitleaks: Fingerprint
#   justificativa por que o risco é aceitável (mínimo de 20 caracteres)
#   validade      AAAA-MM-DD; vencida, o achado volta a barrar o merge
#   alvo          (opcional) trecho do arquivo/pacote/imagem a que se limita
#
# Prefira corrigir. Exceção é para falso positivo comprovado ou risco
# aceito com prazo, e passa por revisão de código como qualquer mudança.

excecoes:
  # Falsos positivos do Gitleaks no commit 9a839ca (Etapa 0). Ficam no
  # histórico, por isso editar o arquivo não resolve: a exceção cita o
  # fingerprint exato (commit:arquivo:regra:linha).
